<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Bolzplatz Reservierung</title>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
    <style>
        :root {
            --fc-border-color: #edf2f7;
            --fc-today-bg-color: #f7fafc;
            --fc-neutral-bg: #fff;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; 
            max-width: 1050px; 
            margin: 30px auto; 
            padding: 20px; 
            background: #f8fafc; 
            color: #1e293b; 
        }
        .header-card {
            background: white;
            padding: 20px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        h2 { margin: 0; color: #0f172a; font-size: 1.5rem; display: flex; align-items: center; gap: 10px; }
        
        #calendar-container { 
            background: white; 
            padding: 24px; 
            border-radius: 16px; 
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05); 
        }
        #calendar { height: 720px; }

        /* Customizing FullCalendar Elements for a Modern Look */
        .fc .fc-toolbar-title { font-size: 1.25rem; font-weight: 700; color: #334155; }
        .fc .fc-button {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #475569;
            font-weight: 600;
            border-radius: 8px;
            padding: 8px 14px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
            transition: all 0.2s ease;
        }
        .fc .fc-button:hover {
            background-color: #f1f5f9;
            border-color: #94a3b8;
            color: #1e293b;
        }
        .fc .fc-button-active {
            background-color: #0284c7 !important;
            border-color: #0284c7 !important;
            color: white !important;
        }
        .fc .fc-col-header-cell {
            background: #f8fafc;
            padding: 10px 0;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
        }
        .fc-timegrid-slot { height: 50px !important; }
        
        /* Event Styling */
        .fc-event {
            border-radius: 8px;
            padding: 4px 8px;
            font-weight: 600;
            border: none;
            box-shadow: 0 2px 4px rgba(220, 53, 69, 0.2);
        }
    </style>
</head>
<body>

    <div class="header-card">
        <h2>⚽ Bolzplatz Reservierung</h2>
        <span style="font-size: 0.9rem; color: #64748b; font-weight: 500;">Tippe auf eine freie Uhrzeit zum Buchen</span>
    </div>

    <div id="calendar-container">
        <div id="calendar"></div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxkK1Wl_6BO4W0KHgK08Bga_iKHp8JUx21GoH9fKJeA90bEVU8JesyU3KAIK2WVzWk9Kg/exec";

        let calendar;

        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');

            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'timeGridWeek',
                locale: 'de',
                slotMinTime: '10:00:00', // Starts at 10:00
                slotMaxTime: '24:00:00', // Ends at 00:00 (Midnight)
                slotDuration: '01:00:00',
                allDaySlot: false,
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'timeGridWeek,timeGridDay'
                },
                buttonText: {
                    today: 'Heute',
                    week: 'Woche',
                    day: 'Tag'
                },
                events: async function(fetchInfo, successCallback, failureCallback) {
                    try {
                        let response = await fetch(API_URL);
                        let bookings = await response.json();
                        
                        let events = bookings.map(b => {
                            let startStr = b.datetime.replace(' ', 'T');
                            let startDate = new Date(startStr);
                            let endStr = new Date(startDate.getTime() + 60*60*1000).toISOString().slice(0, 16);

                            return {
                                id: b.id,
                                title: `🔒 ${b.name} (Gebucht)`,
                                start: startStr,
                                end: endStr,
                                backgroundColor: '#ef4444',
                                borderColor: '#ef4444',
                                textColor: '#fff',
                                extendedProps: { name: b.name }
                            };
                        });
                        successCallback(events);
                    } catch (error) {
                        failureCallback(error);
                    }
                },
                dateClick: async function(info) {
                    let datetimeFormatted = info.dateStr.slice(0, 10) + " " + info.dateStr.slice(11, 16);
                    
                    let name = prompt(`Platz buchen für ${datetimeFormatted}\nDein Name:`);
                    if (!name) return;
                    
                    let pin = prompt("Erstelle eine 4-stellige PIN (zum Stornieren):");
                    if (!pin || pin.length !== 4) {
                        alert("Bitte eine gültige 4-stellige PIN eingeben.");
                        return;
                    }

                    let res = await fetch(API_URL, {
                        method: "POST",
                        body: JSON.stringify({ action: "book", datetime: datetimeFormatted, name, pin })
                    });
                    let result = await res.json();
                    
                    if (result.status === "error") {
                        alert(result.message);
                    } else {
                        calendar.refetchEvents();
                    }
                },
                eventClick: async function(info) {
                    let id = info.event.id;
                    let pin = prompt(`Reservierung von ${info.event.extendedProps.name} stornieren.\nGib deine 4-stellige PIN ein:`);
                    if (!pin) return;

                    let res = await fetch(API_URL, {
                        method: "POST",
                        body: JSON.stringify({ action: "cancel", id, pin })
                    });
                    let result = await res.json();
                    
                    if (result.status === "error") {
                        alert(result.message);
                    } else {
                        calendar.refetchEvents();
                    }
                }
            });

            calendar.render();
        });
    </script>
</body>
</html>
